# nginx reverse proxy for SalonAI (self-hosted)
#
# SEC-02: strips x-middleware-subrequest before forwarding to Next.js.
# This prevents CVE-2025-29927 bypass even against older Next.js builds
# or any future regression. The application layer (middleware.ts + layout)
# also rejects this header as defense-in-depth, but stripping at the edge
# is the first and most reliable control.
#
# Usage:
#   include this file in your server {} block, or copy the relevant
#   location block into an existing nginx config.

upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream fastify {
    server 127.0.0.1:3333;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # Strip internal Next.js header to prevent CVE-2025-29927 middleware bypass.
    # Setting to "" removes the header from the proxied request entirely.
    proxy_set_header x-middleware-subrequest "";

    # Standard proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/ {
        proxy_pass http://fastify;
    }

    location / {
        proxy_pass http://nextjs;
    }
}
