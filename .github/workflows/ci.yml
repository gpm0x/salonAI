name: CI

on:
  pull_request:
  push:
    branches: [main]

# Evita rodar dois CI concorrentes na mesma branch/PR (economiza minutos e evita
# race condition entre pushes seguidos).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    # Valores dummy: nenhum step aqui conecta de fato num banco ou serviço
    # externo. `prisma.config.ts` resolve DATABASE_URL de forma eager (falha
    # no import se a var não existir), e o build do apps/web lê as vars
    # NEXT_PUBLIC_* e BETTER_AUTH_SECRET em build-time (Better Auth client).
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-dummy-secret-do-not-use-in-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
